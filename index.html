<!DOCTYPE html>
<html>
<head>
  <title>Upload IPA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0d1117; color: white; font-family: 'Segoe UI', sans-serif; }
    .upload-box {
        background-color: #161b22;
        padding: 30px;
        border-radius: 12px;
        max-width: 600px;
        margin: auto;
        margin-top: 100px;
        box-shadow: 0 0 10px rgba(255,255,255,0.05);
    }
    .btn-upload {
        background: linear-gradient(135deg, #f39c12, #e67e22);
        border: none;
        font-weight: bold;
    }
    .btn-upload:hover {
        background: linear-gradient(135deg, #f1c40f, #d35400);
    }
  </style>
</head>
<body>
  <div class="upload-box text-center">
    <h2>Upload Your .IPA File</h2>
    <form method="POST" action="/upload" enctype="multipart/form-data">
      <input type="file" name="ipa" accept=".ipa" required class="form-control my-3">
      <button type="submit" class="btn btn-upload w-100 py-2">Generate Install Link</button>
    </form>
    <p class="mt-3 text-secondary">Max: 2GB • Field: <code>ipa</code></p>
  </div>
</body>
</html>
